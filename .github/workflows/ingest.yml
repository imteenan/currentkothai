name: Ingest schedules

# Free on public repos. Cron is UTC; 00/06/12/18 UTC = 06/12/18/00 Dhaka.
on:
  # A run whenever the ingest itself changes: pushing a fix immediately proves
  # it in the environment where it has to work. The data-commit the job makes
  # cannot re-trigger this (GITHUB_TOKEN pushes do not fire workflows, and
  # data/ is not in the paths filter).
  push:
    paths:
      - ".github/workflows/ingest.yml"
      - "workers/**"
  schedule:
    # FOUR runs a day, and not one more. This is a delivery rate, not a wish.
    #
    # GitHub runs scheduled workflows on a best-effort basis and drops them
    # under load, and it throttles repos that ask for a lot. Measured here:
    # with four crons a day we received three to four runs a day, every day
    # (08-24 through 08-26). Changing to twelve crons a day got us THREE runs
    # on 08-27 and none at all in the following eleven hours. Asking for more
    # produced less, so the fix for a missed sheet is never another cron line.
    #
    # The four are aimed at Dhaka daytime rather than spread evenly around the
    # clock, because that is when DESCO issues the day's sheet: Thursday's was
    # up by 12:24 Dhaka and Friday's by 15:09. Runs at 00:17 and 06:17 Dhaka
    # spent two of our four chances on hours when no new sheet exists.
    #
    #   04:40 UTC = 10:40 Dhaka   the morning sheet, shortly after it appears
    #   07:40 UTC = 13:40 Dhaka   backup if DESCO published late
    #   11:40 UTC = 17:40 Dhaka   afternoon revisions
    #   17:40 UTC = 23:40 Dhaka   evening, and DPDC's overnight check
    #
    # :40 rather than :00 because the top of the hour is the most congested
    # slot on the shared scheduler.
    - cron: '40 4,7,11,17 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Limit to one utility (e.g. DESCO)'
        required: false
        type: string
      rebuild_registry:
        description: 'Re-probe every source URL'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    # Reading the 17 scanned zones is OCR-bound: roughly 7 minutes on a fast
    # local machine, and a hosted runner is slower. 25 was close enough to the
    # real figure that a slow run would be killed mid-parse and the day would
    # silently keep yesterday's data. Actions minutes are free on a public repo,
    # so the headroom costs nothing.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install poppler and Tesseract (scanned-sheet OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils tesseract-ocr tesseract-ocr-ben libgl1 libglib2.0-0

      - name: Install dependencies
        run: pip install -r workers/requirements.txt

      - name: Re-probe source registry
        if: inputs.rebuild_registry
        run: python -m workers.ingestion.build_registry

      # continue-on-error so a distributor being down never fails the run;
      # the index.json it writes records the failure honestly instead.
      - name: Run ingestion
        id: ingest
        continue-on-error: true
        run: |
          python -m workers.ingestion.run_ingest \
            ${{ inputs.only && format('--only {0}', inputs.only) || '' }} \
            | tee ingest.log

      - name: Verify published data still parses
        run: |
          python - <<'PY'
          import json, pathlib, sys
          bad = []
          for p in pathlib.Path('data').rglob('*.json'):
              try:
                  json.loads(p.read_text(encoding='utf-8'))
              except Exception as e:
                  bad.append(f"{p}: {e}")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("all JSON valid")
          PY

      - name: Run parser tests
        run: python -m pytest tests -q

      - name: Commit updated data
        run: |
          git config user.name  "power-bd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: refresh schedules $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

      # A dropped scheduled run is silent: no run, no failure, no notification,
      # and the site quietly ages. This step makes the SUCCESSFUL runs report
      # how long it has been since the last one, so a throttled schedule shows
      # up as a warning in the log and in the job summary instead of being
      # discovered days later by looking at the website.
      - name: Warn if the previous run was long ago
        if: always()
        run: |
          LAST=$(git log -1 --format=%cI --grep='^data: refresh schedules' || true)
          if [ -n "$LAST" ]; then
            GAP=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 3600 ))
            echo "hours since the previous data refresh: $GAP"
            echo "Hours since previous refresh: **$GAP**" >> "$GITHUB_STEP_SUMMARY"
            if [ "$GAP" -gt 14 ]; then
              echo "::warning::No ingest run committed for $GAP hours. Four are scheduled daily; GitHub drops scheduled runs under load. If this persists, trigger one by hand from the Actions tab."
            fi
          fi

      - name: Open an issue if ingestion failed
        if: steps.ingest.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const title = 'Ingestion run failed';
            const body = [
              'The scheduled ingestion job reported a failure.',
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The site keeps serving the last validated schedule; check',
              '`data/schedules/index.json` for which feed degraded and',
              '`data/schedules/_quarantine/` for any rejected parse.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ingestion',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['ingestion'],
              });
            }
