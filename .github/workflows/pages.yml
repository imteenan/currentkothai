name: Deploy to GitHub Pages

# The "build" is a copy: apps/web becomes the site root and data/ is copied in
# beside index.html, which is exactly the layout tools/serve.py emulates locally.
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'data/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r apps/web/. _site/
          mkdir -p _site/data
          # Ship only what the browser fetches. The raw source archive and the
          # PDF samples are large and never requested by the site.
          cp -r data/registry   _site/data/
          cp -r data/geo        _site/data/
          cp -r data/schedules  _site/data/
          if [ -d data/validation ]; then cp -r data/validation _site/data/; fi
          # Quarantined parses are for maintainers, not visitors.
          rm -rf _site/data/schedules/_quarantine
          # Keep only the newest dated snapshot per utility alongside latest.json.
          for dir in _site/data/schedules/*/; do
            ls -1 "$dir" 2>/dev/null | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}\.json$' \
              | sort -r | tail -n +8 | while read -r old; do rm -f "$dir$old"; done
          done
          touch _site/.nojekyll
          du -sh _site
          find _site -maxdepth 2 -type d | sort

      - name: Sanity-check the assembled site
        run: |
          test -f _site/index.html
          test -f _site/data/schedules/index.json
          test -f _site/data/registry/sources.json
          python -c "import json;json.load(open('_site/data/schedules/index.json'))"
          echo "site looks sane"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
